spring.application.name=crewops

spring.datasource.url=jdbc:mysql://localhost:3306/crewops
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

crewops.scheduling.maximum-duty-hours=12
crewops.scheduling.minimum-rest-hours=10
crewops.scheduling.maximum-consecutive-duty-days=6